{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<main class="form-layout">
    <section class="form-panel auth-panel">
        <div class="section-head">
            <div>
                <p class="eyebrow">Connexion</p>
                <h1>Acceder a votre espace organisateur</h1>
            </div>
        </div>
        <form method="post" class="invitation-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="field-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="error-list">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button class="button button-primary" type="submit">Se connecter</button>
        </form>
        <div class="auth-links">
            <a class="text-link" href="{% url 'password_reset' %}">Mot de passe oublie ?</a>
        </div>
    </section>
</main>
{% endblock %}
